[project]
name = "ripcord"
version = "0.1.0"
description = "A self-hostable feature-flag & gradual-rollout service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "redis>=5.0",
    "sse-starlette>=2.0",
]

# Installed with `pip install -e ".[dev]"` — kept separate so production
# images don't ship test/lint tooling.
[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",                     # required by fastapi.testclient
    "testcontainers[postgres,redis]>=4.0",  # ephemeral Postgres + Redis for tests
    "psycopg2-binary>=2.9",            # sync driver testcontainers uses for readiness
    "ruff>=0.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Only ship the `ripcord` package — never the tests/ dir.
[tool.setuptools.packages.find]
include = ["ripcord*"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Auto-generated Alembic migrations aren't hand-linted.
extend-exclude = ["migrations"]

[tool.ruff.lint]
# E/F = pyflakes+pycodestyle, I = import sorting, UP = pyupgrade, B = bugbear.
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Silence known third-party deprecation noise (starlette TestClient + anyio),
# so a real warning from our own code actually stands out.
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated",
]
