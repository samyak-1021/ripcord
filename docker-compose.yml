# Local stack for Ripcord.
#   docker compose up -d --build          # API :8000 + dashboard :3000
#   docker compose up -d postgres redis   # just the deps (API run on the host)
#
# Auth is ON by default. BOOTSTRAP_ADMIN_KEY below is a *development* key with a
# deliberately obvious value — it exists so `docker compose up` works in one
# command. Generate a real one with `python -m ripcord.cli mint-bootstrap`, put
# it in a local .env, and unset it entirely once you have minted a stored admin
# key via POST /keys.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ripcord
      POSTGRES_PASSWORD: ripcord
      POSTGRES_DB: ripcord
    ports:
      - "5432:5432"
    volumes:
      - ripcord_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ripcord"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://ripcord:ripcord@postgres:5432/ripcord
      REDIS_URL: redis://redis:6379/0
      AUTH_ENABLED: "true"
      BOOTSTRAP_ADMIN_KEY: ${BOOTSTRAP_ADMIN_KEY:-rpc_0000devonly00_LOCAL-DEVELOPMENT-KEY-DO-NOT-USE-IN-PRODUCTION}
      CORS_ORIGINS: '["http://localhost:3000"]'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  dashboard:
    build:
      context: ./dashboard
      args:
        # Baked in at build time: Next.js inlines NEXT_PUBLIC_* into the client
        # bundle, so this cannot be supplied at runtime.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  ripcord_pgdata:
