# Local stack for Ripcord.
#   docker compose up -d --build          # everything, incl. the API on :8000
#   docker compose up -d postgres redis   # just the deps (API run on the host)
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ripcord
      POSTGRES_PASSWORD: ripcord
      POSTGRES_DB: ripcord
    ports:
      - "5432:5432"
    volumes:
      - ripcord_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ripcord"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://ripcord:ripcord@postgres:5432/ripcord
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  ripcord_pgdata:
